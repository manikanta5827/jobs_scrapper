AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Multi-Tenant Job Scrapper template (Fan-Out Dispatcher + Per-User Worker Architecture)

# PARAMETERS
Parameters:
  AdminEmail:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Email address for admin alerts
    Default: /job-scraper/ADMIN_EMAIL
  AppEnv:
    Type: String
    Description: Application environment (dev/prod)
    Default: prod
  LogRetentionDays:
    Type: Number
    Description: CloudWatch Log retention in days
    Default: 3
  ApifyApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: API Key for Apify service to fetch job listings
    Default: /job-scraper/APIFY_API_KEY
  DeepseekApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: API Key for DeepSeek service to evaluate job relevance
    Default: /job-scraper/DEEPSEEK_API_KEY
  DatabaseUrl:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Database connection URL (Postgres/Drizzle)
    Default: /job-scraper/DATABASE_URL
  AdminApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: API Key used to authenticate admin requests
    Default: /job-scraper/ADMIN_API_KEY
  MinMatchScore:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Minimum AI match score for a job to be considered relevant
    Default: /job-scraper/MIN_MATCH_SCORE
  TelegramMatchedJobsBotToken:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Telegram Bot Token for the bot that notifies about matched jobs
    Default: /job-scraper/TELEGRAM_MATCHED_JOBS_BOT_TOKEN
  CloudflareImageWorkerUrl:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: URL of the Cloudflare Worker that generates company name images
    Default: /job-scraper/CLOUDFLARE_IMAGE_WORKER_URL
  PosthogProjectToken:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: PostHog Project Token for AI Observability
    Default: /job-scraper/POSTHOG_PROJECT_TOKEN
  PosthogHost:
    Type: String
    Description: PostHog Host URL for AI Observability
    Default: "https://us.i.posthog.com"

Resources:

  # ─── API GATEWAY WITH CUSTOM RESPONSES & NATIVE CORS ───────────────────────
  APIGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      MinimumCompressionSize: 1024
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error": "Unauthorized: Invalid or missing API key.", "type": "UNAUTHORIZED"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error": "Access Denied.", "type": "ACCESS_DENIED"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        MISSING_AUTHENTICATION_TOKEN:
          StatusCode: 404
          ResponseTemplates:
            application/json: '{"error": "Route or Method not found.", "type": "NOT_FOUND"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        DEFAULT_4XX:
          ResponseTemplates:
            application/json: '{"error": "$context.error.messageString", "type": "$context.error.responseType"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        DEFAULT_5XX:
          ResponseTemplates:
            application/json: '{"error": "$context.error.messageString", "type": "$context.error.responseType"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"

  # ─── LAMBDA FUNCTIONS ──────────────────────────────────────────────────────

  # Main Orchestrator / Dispatcher Lambda triggered 2x daily (Mon-Sat)
  MainLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: lambda.handler
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - LambdaInvokePolicy:
            FunctionName: !Ref UserWorkerLambda
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          ADMIN_API_KEY: !Ref AdminApiKey
          USER_WORKER_FUNCTION_NAME: !Ref UserWorkerLambda
          APP_ENV: !Ref AppEnv

      Events:
        # Morning run at 11:30 AM IST, Monday through Saturday
        MorningRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 11 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 14, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
        # Afternoon run at 4:30 PM IST, Monday through Saturday
        AfternoonRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 16 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 6, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
        # Evening run at 8:30 PM IST, Monday through Saturday
        EveningRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 20 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 5, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - lambda.ts

  # Isolated Per-User Worker Lambda (Invoked asynchronously per candidate user)
  UserWorkerLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: user_worker.handler
      Timeout: 900
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource: !GetAtt PostQueue.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:linkedin-jobs-scraper-prod'
      Environment:
        Variables:
          APIFY_API_KEY: !Ref ApifyApiKey
          DEEPSEEK_API_KEY: !Ref DeepseekApiKey
          DATABASE_URL: !Ref DatabaseUrl
          MIN_MATCH_SCORE: !Ref MinMatchScore
          APP_ENV: !Ref AppEnv
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
          ADMIN_API_KEY: !Ref AdminApiKey
          POST_QUEUE_URL: !Ref PostQueue
          DEFAULT_BILLED_RUN_COST_USD: "0.1"
          MIN_RUN_BALANCE: "0.1"
          LINKEDIN_SCRAPER_FUNCTION_NAME: linkedin-jobs-scraper-prod
          POSTHOG_PROJECT_TOKEN: !Ref PosthogProjectToken
          POSTHOG_HOST: !Ref PosthogHost
    EventInvokeConfig:
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 3600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - user_worker.ts

  # Admin Lambda Endpoint for manual triggers and RESTful user CRUD API
  AdminLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: admin.handler
      Timeout: 300
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - LambdaInvokePolicy:
            FunctionName: !Ref MainLambda
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          DEEPSEEK_API_KEY: !Ref DeepseekApiKey
          APP_ENV: !Ref AppEnv
          ADMIN_API_KEY: !Ref AdminApiKey
          MAIN_LAMBDA_FUNCTION_NAME: !Ref MainLambda
          POSTHOG_PROJECT_TOKEN: !Ref PosthogProjectToken
          POSTHOG_HOST: !Ref PosthogHost
      Events:
        # GET /users/{id}/jobs — Retrieve candidate matched jobs list JSON
        GetUserJobs:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}/jobs
            Method: GET

        # GET /stats — Financial analytics & profit dashboard
        GetStats:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /stats
            Method: GET

        # POST /run — Trigger main scraper Lambda
        RunMainLambda:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /run
            Method: POST

        # POST /admin/analyze-resume — Analyze resume with LLM synchronously
        AnalyzeResume:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /admin/analyze-resume
            Method: POST

        # GET /users & POST /users
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users
            Method: POST

        # GET /users/{id}, PUT /users/{id}, DELETE /users/{id}
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}
            Method: PUT
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}
            Method: DELETE

        # POST /users/{id}/topup — Recharge user wallet balance
        TopupUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}/topup
            Method: POST

        # GET /apify-keys & POST /apify-keys
        GetApifyKeys:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /apify-keys
            Method: GET
        CreateApifyKey:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /apify-keys
            Method: POST

        # PUT /apify-keys/{id} & DELETE /apify-keys/{id}
        UpdateApifyKey:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /apify-keys/{id}
            Method: PUT
        DeleteApifyKey:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /apify-keys/{id}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - admin.ts

  # Telegram Bot Webhook Lambda for /start, /stop, /balance commands
  TelegramWebhookLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: telegram_webhook.handler
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
          APP_ENV: !Ref AppEnv
      Events:
        TelegramWebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /webhook/telegram
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - telegram_webhook.ts

  PostQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 345600

  PostSchedulerLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: post_scheduler.handler
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
              Resource: !GetAtt PostQueue.Arn
      Environment:
        Variables:
          POST_QUEUE_URL: !Ref PostQueue
          CLOUDFLARE_IMAGE_WORKER_URL: !Ref CloudflareImageWorkerUrl
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
          APP_ENV: !Ref AppEnv
          DATABASE_URL: !Ref DatabaseUrl
      Events:
        PostSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/30 * * * ? *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - post_scheduler.ts

  # ─── CLOUDWATCH LOG GROUPS WITH 3-DAY RETENTION ────────────────────────────
  MyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${MainLambda}"
      RetentionInDays: !Ref LogRetentionDays

  UserWorkerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${UserWorkerLambda}"
      RetentionInDays: !Ref LogRetentionDays

  AdminLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AdminLambda}"
      RetentionInDays: !Ref LogRetentionDays

  TelegramWebhookLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TelegramWebhookLambda}"
      RetentionInDays: !Ref LogRetentionDays

  PostSchedulerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PostSchedulerLambda}"
      RetentionInDays: !Ref LogRetentionDays

  AdminAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail

  MainLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${MainLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MainLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  UserWorkerLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${UserWorkerLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UserWorkerLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  AdminLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${AdminLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  TelegramWebhookLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${TelegramWebhookLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TelegramWebhookLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  PostSchedulerLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${PostSchedulerLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PostSchedulerLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

Outputs:
  AdminDashboardUrl:
    Description: "Direct URL to open Admin Web Dashboard in browser"
    Value: !Sub "https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/admin.html"
  ApiGatewayUrl:
    Description: "API Gateway base URL for Admin API"
    Value: !Sub "https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  TelegramWebhookUrl:
    Description: "API Gateway base URL for Telegram Webhook"
    Value: !Sub "https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook/telegram"

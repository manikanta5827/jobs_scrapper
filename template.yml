AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Multi-Tenant Job Scrapper template (Fan-Out Dispatcher + Per-User Worker Architecture )

# PARAMETERS
Parameters:
  AdminEmail:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Email address for admin alerts
    Default: /job-scraper/ADMIN_EMAIL
  LogRetentionDays:
    Type: Number
    Description: CloudWatch Log retention in days
    Default: 3
  LlmApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: API Key for LLM service (OpenRouter) to evaluate job relevance
    Default: /job-scraper/LLM_API_KEY
  DatabaseUrl:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Database connection URL (Postgres/Drizzle)
    Default: /job-scraper/DATABASE_URL
  AdminApiKey:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: API Key used to authenticate admin requests
    Default: /job-scraper/ADMIN_API_KEY
  MinMatchScore:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Minimum AI match score for a job to be considered relevant
    Default: /job-scraper/MIN_MATCH_SCORE
  TelegramMatchedJobsBotToken:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: Telegram Bot Token for the bot that notifies about matched jobs
    Default: /job-scraper/TELEGRAM_MATCHED_JOBS_BOT_TOKEN
  CloudflareImageWorkerUrl:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: URL of the Cloudflare Worker that generates company name images
    Default: /job-scraper/CLOUDFLARE_IMAGE_WORKER_URL
  PosthogProjectToken:
    Type: "AWS::SSM::Parameter::Value<String>"
    Description: PostHog Project Token for AI Observability
    Default: /job-scraper/POSTHOG_PROJECT_TOKEN
  PosthogHost:
    Type: String
    Description: PostHog Host URL for AI Observability
    Default: "https://us.i.posthog.com"

Resources:

  # ─── AWS S3 RAW JOBS STORAGE (7-day retention) ─────────────────────────────
  RawJobsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawJobsAfter7Days
            Status: Enabled
            Prefix: raw-jobs/
            ExpirationInDays: 1
      BucketName: !Sub 'job-scraper-raw-jobs-${AWS::AccountId}'

  # ─── API GATEWAY WITH CUSTOM RESPONSES & NATIVE CORS ───────────────────────
  APIGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      MinimumCompressionSize: 1024
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      GatewayResponses:
        UNAUTHORIZED:
          StatusCode: 401
          ResponseTemplates:
            application/json: '{"error": "Unauthorized: Invalid or missing API key.", "type": "UNAUTHORIZED"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        ACCESS_DENIED:
          StatusCode: 403
          ResponseTemplates:
            application/json: '{"error": "Access Denied.", "type": "ACCESS_DENIED"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        MISSING_AUTHENTICATION_TOKEN:
          StatusCode: 404
          ResponseTemplates:
            application/json: '{"error": "Route or Method not found.", "type": "NOT_FOUND"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        DEFAULT_4XX:
          ResponseTemplates:
            application/json: '{"error": "$context.error.messageString", "type": "$context.error.responseType"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"
        DEFAULT_5XX:
          ResponseTemplates:
            application/json: '{"error": "$context.error.messageString", "type": "$context.error.responseType"}'
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,X-Api-Key,Authorization,x-api-key'"

  # ─── LAMBDA FUNCTIONS ──────────────────────────────────────────────────────

  # Main Orchestrator / ScraperDispatcherLambda triggered 3x daily (Mon-Sat)
  ScraperDispatcherLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: scraper_dispatcher.handler
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:linkedin-jobs-scraper'
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:naukri-jobs-scraper'
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:simplyhired-jobs-scraper'
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:indeed-jobs-scraper'
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          ADMIN_API_KEY: !Ref AdminApiKey
          S3_BUCKET_NAME: !Ref RawJobsBucket
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
          LINKEDIN_SCRAPER_FUNCTION_NAME: linkedin-jobs-scraper
          NAUKRI_SCRAPER_FUNCTION_NAME: naukri-jobs-scraper
          SIMPLYHIRED_SCRAPER_FUNCTION_NAME: simplyhired-jobs-scraper
          INDEED_SCRAPER_FUNCTION_NAME: indeed-jobs-scraper

      Events:
        # Run 1: 11 AM IST, Mon-SAT — catches overnight jobs from previous evening
        MorningRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 11 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 14, "adminApiKey": "${AdminApiKey}", "includeFreeTier": true}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
        # Run 3: 4 PM IST, Mon-Sat — catches afternoon postings
        EveningRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 16 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 5, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
        # Run 4: 8 PM IST, Mon-Sat — catches evening postings
        NightRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 20 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 5, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - scraper_dispatcher.ts

  # Evaluator Orchestrator / Dispatcher Lambda triggered 30 mins after scrapers (11:30, 16:30, 20:30 IST)
  EvaluatorDispatcherLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: evaluator_dispatcher.handler
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - LambdaInvokePolicy:
            FunctionName: !Ref EvaluatorLambda
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          ADMIN_API_KEY: !Ref AdminApiKey
          EVALUATOR_FUNCTION_NAME: !Ref EvaluatorLambda
      Events:
        MorningEvalRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 11 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 14, "adminApiKey": "${AdminApiKey}", "includeFreeTier": true}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
        EveningEvalRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 16 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 5, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
        NightEvalRun:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 20 ? * MON-SAT *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            Input: !Sub '{"lookbackHours": 5, "adminApiKey": "${AdminApiKey}"}'
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - evaluator_dispatcher.ts

  # Isolated Per-User EvaluatorLambda (Invoked asynchronously per candidate user)
  EvaluatorLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: evaluator.handler
      Timeout: 900
      ReservedConcurrentExecutions: 10
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt RawJobsBucket.Arn
              Condition:
                StringLike:
                  s3:prefix:
                    - "raw-jobs/*"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:DeleteObject
              Resource: !Sub "${RawJobsBucket.Arn}/raw-jobs/*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:SendMessageBatch
              Resource: !GetAtt PostQueue.Arn
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref RawJobsBucket
          LLM_API_KEY: !Ref LlmApiKey
          DATABASE_URL: !Ref DatabaseUrl
          MIN_MATCH_SCORE: !Ref MinMatchScore
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
          ADMIN_API_KEY: !Ref AdminApiKey
          POST_QUEUE_URL: !Ref PostQueue
          LINKEDIN_SCRAPER_FUNCTION_NAME: linkedin-jobs-scraper
          NAUKRI_SCRAPER_FUNCTION_NAME: naukri-jobs-scraper
          SIMPLYHIRED_SCRAPER_FUNCTION_NAME: simplyhired-jobs-scraper
          INDEED_SCRAPER_FUNCTION_NAME: indeed-jobs-scraper
          POSTHOG_PROJECT_TOKEN: !Ref PosthogProjectToken
          POSTHOG_HOST: !Ref PosthogHost
    EventInvokeConfig:
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 3600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - evaluator.ts

  # Admin Lambda Endpoint for manual triggers and RESTful user CRUD API
  AdminLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: admin.handler
      Timeout: 300
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - LambdaInvokePolicy:
            FunctionName: !Ref ScraperDispatcherLambda
        - LambdaInvokePolicy:
            FunctionName: !Ref EvaluatorDispatcherLambda
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          LLM_API_KEY: !Ref LlmApiKey
          MIN_MATCH_SCORE: !Ref MinMatchScore
          ADMIN_API_KEY: !Ref AdminApiKey
          SCRAPER_DISPATCHER_FUNCTION_NAME: !Ref ScraperDispatcherLambda
          EVALUATOR_DISPATCHER_FUNCTION_NAME: !Ref EvaluatorDispatcherLambda
          POSTHOG_PROJECT_TOKEN: !Ref PosthogProjectToken
          POSTHOG_HOST: !Ref PosthogHost
      Events:
        # GET /jobs/{id}/resume — Retrieve or generate candidate ATS-optimized resume Markdown for a job
        GetJobResume:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /jobs/{id}/resume
            Method: GET

        # GET /users/{id}/jobs — Retrieve candidate matched jobs list JSON
        GetUserJobs:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}/jobs
            Method: GET

        # GET /stats — Financial analytics & profit dashboard
        GetStats:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /stats
            Method: GET

        # POST /run — Trigger main scraper dispatcher Lambda
        RunScraperDispatcher:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /run
            Method: POST

        # POST /run-evaluator — Trigger evaluator dispatcher Lambda
        RunEvaluatorDispatcher:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /run-evaluator
            Method: POST

        # POST /admin/analyze-resume — Analyze resume with LLM synchronously
        AnalyzeResume:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /admin/analyze-resume
            Method: POST

        # GET /users & POST /users
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users
            Method: GET
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users
            Method: POST

        # GET /users/{id}, PUT /users/{id}, DELETE /users/{id}
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}
            Method: GET
        UpdateUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}
            Method: PUT
        DeleteUser:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}
            Method: DELETE

        # POST /users/{id}/subscription — Update user subscription tier
        ManageSubscription:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /users/{id}/subscription
            Method: POST

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - admin.ts

  # Telegram Bot Webhook Lambda for /start, /stop, /balance commands
  TelegramWebhookLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: telegram_webhook.handler
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
      Events:
        TelegramWebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref APIGateway
            Path: /webhook/telegram
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - telegram_webhook.ts

  PostQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 300
      MessageRetentionPeriod: 345600

  PostSchedulerLambda:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      LoggingConfig:
        LogFormat: JSON
      CodeUri: src/
      Handler: post_scheduler.handler
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - SSMParameterReadPolicy:
            ParameterName: "/job-scraper/*"
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
              Resource: !GetAtt PostQueue.Arn
      Environment:
        Variables:
          POST_QUEUE_URL: !Ref PostQueue
          CLOUDFLARE_IMAGE_WORKER_URL: !Ref CloudflareImageWorkerUrl
          TELEGRAM_MATCHED_JOBS_BOT_TOKEN: !Ref TelegramMatchedJobsBotToken
          DATABASE_URL: !Ref DatabaseUrl
          MIN_MATCH_SCORE: !Ref MinMatchScore
      Events:
        PostSchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0/30 * * * ? *)
            ScheduleExpressionTimezone: "Asia/Kolkata"
            RetryPolicy:
              MaximumRetryAttempts: 0
              MaximumEventAgeInSeconds: 3600
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        Sourcemap: true
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"
          - "aws-lambda"
        EntryPoints:
          - post_scheduler.ts

  # ─── CLOUDWATCH LOG GROUPS WITH 3-DAY RETENTION ────────────────────────────
  ScraperDispatcherLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ScraperDispatcherLambda}"
      RetentionInDays: !Ref LogRetentionDays

  EvaluatorDispatcherLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EvaluatorDispatcherLambda}"
      RetentionInDays: !Ref LogRetentionDays

  EvaluatorLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${EvaluatorLambda}"
      RetentionInDays: !Ref LogRetentionDays

  AdminLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AdminLambda}"
      RetentionInDays: !Ref LogRetentionDays

  TelegramWebhookLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${TelegramWebhookLambda}"
      RetentionInDays: !Ref LogRetentionDays

  PostSchedulerLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PostSchedulerLambda}"
      RetentionInDays: !Ref LogRetentionDays

  AdminAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail

  ScraperDispatcherLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${ScraperDispatcherLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScraperDispatcherLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  EvaluatorLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${EvaluatorLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EvaluatorLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  AdminLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${AdminLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  TelegramWebhookLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${TelegramWebhookLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TelegramWebhookLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

  PostSchedulerLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "Triggers if ${PostSchedulerLambda} fails"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PostSchedulerLambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlertTopic

Outputs:
  AdminDashboardUrl:
    Description: "Direct URL to open Admin Web Dashboard in browser"
    Value: !Sub "https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/admin.html"
  ApiGatewayUrl:
    Description: "API Gateway base URL for Admin API"
    Value: !Sub "https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  TelegramWebhookUrl:
    Description: "API Gateway base URL for Telegram Webhook"
    Value: !Sub "https://${APIGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook/telegram"
  RawJobsBucketName:
    Description: "Name of S3 Bucket storing raw scraped job JSON files"
    Value: !Ref RawJobsBucket
  EvaluatorDispatcherLambdaArn:
    Description: "ARN of EvaluatorDispatcherLambda"
    Value: !GetAtt EvaluatorDispatcherLambda.Arn

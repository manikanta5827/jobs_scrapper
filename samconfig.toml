version = 0.1

[default.deploy.parameters]
stack_name = "job-scrapper"
resolve_s3 = true
s3_prefix = "job-scrapper"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
image_repositories = []
parameter_overrides = "ApifyApiKey=\"/job-scraper/APIFY_API_KEY\" DeepseekApiKey=\"/job-scraper/DEEPSEEK_API_KEY\" DatabaseUrl=\"/job-scraper/DATABASE_URL\" MinMatchScore=\"/job-scraper/MIN_MATCH_SCORE\" TelegramMatchedJobsBotToken=\"/job-scraper/TELEGRAM_MATCHED_JOBS_BOT_TOKEN\""

[default.global.parameters]
region = "ap-south-1"

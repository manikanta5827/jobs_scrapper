<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="description" content="ATS-tailored professional resume generated for your target LinkedIn job match." />
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Marked.js Markdown Parser from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    /* Top Action Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .job-meta {
      display: flex;
      flex-direction: column;
    }

    .job-meta h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .job-meta span {
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-outline:hover {
      background: #f8fafc;
    }

    /* Resume Card */
    .resume-card {
      background: var(--card-bg);
      padding: 48px;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .resume-card.editing {
      border-color: #f59e0b;
      border-style: dashed;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
    }

    #resumeContent[contenteditable="true"] {
      outline: none;
      cursor: text;
    }

    #resumeContent[contenteditable="true"] h1,
    #resumeContent[contenteditable="true"] h2,
    #resumeContent[contenteditable="true"] h3,
    #resumeContent[contenteditable="true"] p,
    #resumeContent[contenteditable="true"] li {
      cursor: text;
    }

    .btn-editing {
      background: #fef3c7 !important;
      border-color: #f59e0b !important;
      color: #92400e !important;
    }

    /* Clean Typography inside Resume */
    #resumeContent {
      color: #1e293b;
    }

    #resumeContent h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }

    #resumeContent h2 {
      font-size: 18px;
      font-weight: 600;
      margin-top: 24px;
      margin-bottom: 12px;
      color: #1e293b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 6px;
    }

    #resumeContent h3 {
      font-size: 16px;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 6px;
      color: #334155;
    }

    #resumeContent p {
      margin-bottom: 12px;
      font-size: 15px;
    }

    #resumeContent ul, #resumeContent ol {
      margin-left: 20px;
      margin-bottom: 16px;
    }

    #resumeContent li {
      margin-bottom: 6px;
      font-size: 15px;
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .loader-spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 28px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .progress-bar-track {
      width: 100%;
      max-width: 400px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      margin: 0 auto 24px auto;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 3px;
      transition: width 0.6s ease;
      width: 0%;
    }

    .progress-label {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 20px;
    }

    .stage-list {
      text-align: left;
      max-width: 360px;
      margin: 0 auto;
      list-style: none;
    }

    .stage-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 14px;
      color: #94a3b8;
      transition: color 0.3s ease;
    }

    .stage-item.active {
      color: #1e293b;
      font-weight: 500;
    }

    .stage-item.done {
      color: #16a34a;
    }

    .stage-dot {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
    }

    /* Error alert */
    .error-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #f87171;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    /* ATS Tailoring Audit */
    .tailor-audit {
      margin-top: 32px;
      border-top: 2px solid #e2e8f0;
      padding-top: 20px;
    }

    .audit-summary {
      font-size: 15px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      padding: 8px 0;
      user-select: none;
    }

    .audit-section {
      margin-top: 12px;
    }

    .audit-section h4 {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .audit-section ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .audit-section li {
      font-size: 13px;
      color: #475569;
      padding: 4px 0 4px 20px;
      position: relative;
    }

    .audit-section li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: #64748b;
    }

    /* PRISTINE ATS PRINT-TO-PDF STYLESHEET */
    @media print {
      body {
        background: white !important;
        padding: 0.75in !important;
        margin: 0 !important;
        color: black !important;
      }

      .no-print, .action-bar, .error-alert, .tailor-audit {
        display: none !important;
      }

      .container {
        max-width: 100% !important;
        width: 100% !important;
      }

      .resume-card {
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
      }

      #resumeContent {
        color: black !important;
        font-size: 11pt;
        line-height: 1.4;
      }

      #resumeContent h1, #resumeContent h2, #resumeContent h3 {
        color: black !important;
        page-break-after: avoid;
      }

      #resumeContent ul, #resumeContent ol, #resumeContent p {
        page-break-inside: avoid;
      }

      @page {
        margin: 0;
        size: A4;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <div class="action-bar no-print">
      <div class="job-meta">
        <h1 id="jobTitleHeading">ATS-Optimized Resume</h1>
        <span id="companySubtext">Tailored for LinkedIn Match</span>
      </div>
      <div class="btn-group">
        <button id="editBtn" class="btn btn-outline" onclick="toggleEdit()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit Resume
        </button>
        <a id="applyLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="display: none;">
          🚀 Open Job on LinkedIn
        </a>
        <button id="printBtn" class="btn btn-primary" onclick="window.print()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Save as ATS PDF (Ctrl+P)
        </button>
      </div>
    </div>

    <!-- Error container -->
    <div id="errorAlert" class="error-alert"></div>

    <!-- Main Resume Page -->
    <main class="resume-card">
      <div id="loadingState" class="loading-state">
        <div class="loader-spinner"></div>
        <div class="progress-label" id="progressLabel">Initializing...</div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <ul class="stage-list" id="stageList">
          <li class="stage-item" data-stage="0">
            <span class="stage-dot">○</span>
            <span>Loading started</span>
          </li>
          <li class="stage-item" data-stage="1">
            <span class="stage-dot">○</span>
            <span>Processing job description</span>
          </li>
          <li class="stage-item" data-stage="2">
            <span class="stage-dot">○</span>
            <span>Creating ATS-optimized resume</span>
          </li>
          <li class="stage-item" data-stage="3">
            <span class="stage-dot">○</span>
            <span>Adding ATS keywords</span>
          </li>
        </ul>
      </div>
      <div id="resumeContent" style="display: none;"></div>
      <div id="tailorAudit" class="tailor-audit" style="display: none;">
        <details open>
          <summary class="audit-summary">ATS Tailoring Audit</summary>
          <div class="audit-section">
            <h4>Changes Made</h4>
            <ul id="changesMadeList"></ul>
          </div>
          <div class="audit-section">
            <h4>ATS Keywords Incorporated</h4>
            <ul id="keywordsUsedList"></ul>
          </div>
        </details>
      </div>
    </main>
  </div>

  <script>
    const API_BASE_URL = 'https://mt07rx0ojd.execute-api.ap-south-1.amazonaws.com/Prod';

    function getJobIdParam() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || null;
    }

    const progressLabels = ['Initializing...', 'Processing job description...', 'Creating ATS resume...', 'Adding ATS keywords...', 'Finalizing...'];
    const progressPercents = [0, 15, 35, 60, 85];

    function updateProgressStage(stageIndex) {
      const items = document.querySelectorAll('#stageList .stage-item');
      const bar = document.getElementById('progressBarFill');
      const label = document.getElementById('progressLabel');

      bar.style.width = progressPercents[stageIndex] + '%';
      label.textContent = progressLabels[stageIndex];

      items.forEach((item, i) => {
        if (i < stageIndex) {
          item.className = 'stage-item done';
          item.querySelector('.stage-dot').textContent = '✓';
        } else if (i === stageIndex) {
          item.className = 'stage-item active';
          item.querySelector('.stage-dot').textContent = '●';
        }
      });
    }

    async function loadResume() {
      const jobId = getJobIdParam();
      const errorDiv = document.getElementById('errorAlert');
      const loadingDiv = document.getElementById('loadingState');
      const contentDiv = document.getElementById('resumeContent');
      const heading = document.getElementById('jobTitleHeading');
      const subtext = document.getElementById('companySubtext');

      if (!jobId) {
        loadingDiv.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.innerText = '⚠️ No Job ID provided in URL.';
        return;
      }

      let progressIdx = 0;
      const progressTimer = setInterval(() => {
        if (progressIdx < 4) {
          progressIdx++;
          updateProgressStage(progressIdx);
        }
      }, 2000);
      updateProgressStage(0);

      try {
        const apiUrl = `${API_BASE_URL}/jobs/${encodeURIComponent(jobId)}/resume`;
        const response = await fetch(apiUrl);

        clearInterval(progressTimer);
        updateProgressStage(4);
        document.getElementById('progressBarFill').style.width = '100%';
        document.getElementById('progressLabel').textContent = 'Done!';

        if (!response.ok) {
          throw new Error(`Failed to load resume: ${response.statusText} (${response.status})`);
        }

        const data = await response.json();
        
        if (data.jobTitle) heading.innerText = data.jobTitle;
        if (data.companyName) subtext.innerText = `Tailored for ${data.companyName} (${data.location || 'LinkedIn'})`;

        if (!data.optimizedResumeMd) {
          throw new Error('No ATS-optimized resume Markdown found for this job. Generation may have failed.');
        }

        // Brief delay so user sees "Done!" before content appears
        await new Promise(r => setTimeout(r, 600));

        contentDiv.innerHTML = marked.parse(data.optimizedResumeMd);
        loadingDiv.style.display = 'none';
        contentDiv.style.display = 'block';

        // Render ATS tailoring audit if available
        const changesList = document.getElementById('changesMadeList');
        const keywordsList = document.getElementById('keywordsUsedList');
        const auditDiv = document.getElementById('tailorAudit');

        if (data.changesMade && data.changesMade.length > 0) {
          changesList.innerHTML = data.changesMade.map(c => `<li>${escapeHtml(c)}</li>`).join('');
          auditDiv.style.display = 'block';
        }
        if (data.keywordsUsed && data.keywordsUsed.length > 0) {
          keywordsList.innerHTML = data.keywordsUsed.map(k => `<li>${escapeHtml(k)}</li>`).join('');
          auditDiv.style.display = 'block';
        }

      } catch (err) {
        clearInterval(progressTimer);
        console.error('Error fetching ATS resume:', err);
        loadingDiv.style.display = 'none';
        errorDiv.style.display = 'block';
        errorDiv.innerText = `⚠️ ${err.message || err}`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function toggleEdit() {
      const content = document.getElementById('resumeContent');
      const editBtn = document.getElementById('editBtn');
      const card = document.querySelector('.resume-card');
      const audit = document.getElementById('tailorAudit');
      const isEditing = content.contentEditable === 'true';

      if (isEditing) {
        content.contentEditable = 'false';
        card.classList.remove('editing');
        editBtn.classList.remove('btn-editing');
        editBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>Edit Resume`;
        if (audit) audit.style.display = audit.dataset.prevDisplay || 'none';
      } else {
        content.contentEditable = 'true';
        card.classList.add('editing');
        editBtn.classList.add('btn-editing');
        editBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>Done Editing`;
        if (audit) {
          audit.dataset.prevDisplay = audit.style.display;
          audit.style.display = 'none';
        }
      }
    }

    window.addEventListener('DOMContentLoaded', loadResume);
  </script>
</body>
</html>
